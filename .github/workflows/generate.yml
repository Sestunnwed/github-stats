name: Generate GitHub Stats SVG

on:
  schedule:
    # GitHub Actions uses UTC. 22:00 UTC = 06:00 (UTC+8) next day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev

      - name: Build
        run: make clean && make

      - name: Run generator
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ vars.GITHUB_ACTOR }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          COUNT_STATS_FROM_FORKS: ${{ secrets.COUNT_STATS_FROM_FORKS }}
        run: ./github-stats

      - name: Commit to the output branch of repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d generated ]; then
            echo "generated/ not found"
            exit 1
          fi

          cp -r generated /tmp/generated

          git checkout --orphan output
          git rm -rf . || true

          cp -r /tmp/generated generated

          git add generated
          git commit -m "Update generated files" || echo "No changes to commit"
          git push origin output -f
